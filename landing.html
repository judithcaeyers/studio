<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rho & Sigma</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Roboto:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --ease:cubic-bezier(.2,.9,.2,1);
      --dur:700ms;

      --title-size:clamp(44px,6vw,96px);
      --pad:clamp(18px,3vw,36px);
      --gap:18px;

      --tagline-size:clamp(14px,1.35vw,18px);
      --tagline-max:44ch;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:"EB Garamond", serif;
      overflow:hidden; /* landing is full-screen only */
    }

    /* ===== HERO ===== */
    .heroWrap{
      height:100svh;
      width:100%;
      position:relative;
      overflow:hidden;
      background:#000;
    }

    .hero{
      height:100%;
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      will-change:transform;
    }

    .panel{
      position:relative;
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      height:100%;
    }

    .panel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.03);
      filter:contrast(1.05) brightness(.9);
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.12), rgba(0,0,0,.55));
      pointer-events:none;
    }

    /* hover hint */
    .hint{
      position:absolute;
      left:var(--pad);
      right:var(--pad);
      bottom:var(--pad);
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:16px;
      opacity:0;
      transform:translateY(8px);
      transition:opacity 300ms var(--ease), transform 300ms var(--ease);
      pointer-events:none;
    }
    .panel:hover .hint{ opacity:1; transform:translateY(0); }
    .hint span{
      font-family:"Roboto", sans-serif;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size:12px;
      opacity:.85;
    }

    /* ===== HALF TITLES + TAGLINES ===== */
    .halfTitle{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      z-index:6;
      width:50%;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:14px;
      padding:0 var(--pad);
      pointer-events:none; /* clicks go to panels */
    }
    .halfTitle.left{ left:0; }
    .halfTitle.right{ right:0; }

    .wordBtn{
      pointer-events:auto; /* buttons clickable */
      background:transparent;
      border:none;
      color:var(--fg);
      font-family:"Roboto", sans-serif;
      font-weight:700;
      letter-spacing:.02em;
      text-transform:uppercase;
      font-size:var(--title-size);
      line-height:1;
      padding:0;
      cursor:pointer;
      transition:opacity 240ms var(--ease), transform 240ms var(--ease);
      text-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .wordBtn:focus-visible{
      outline:2px solid rgba(255,255,255,.9);
      outline-offset:6px;
    }

    .tagline{
      max-width:var(--tagline-max);
      font-size:var(--tagline-size);
      line-height:1.35;
      opacity:.85;
      padding:6px 14px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      backdrop-filter:blur(6px);
      background:rgba(0,0,0,.18);
    }

    /* ampersand on seam */
    .amp{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:7;
      font-family:"Roboto", sans-serif;
      font-weight:700;
      font-size:var(--title-size);
      line-height:1;
      text-shadow:0 10px 30px rgba(0,0,0,.35);
      pointer-events:none;
    }

    /* ===== EXPAND ANIM ===== */
    .panelLeft,.panelRight{
      will-change:transform;
      transition:transform var(--dur) var(--ease);
    }

    /* RHO: push right away */
    body.choice-rho .panelRight{ transform:translateX(100%); }
    body.choice-rho .panelLeft{ transform:translateX(0); }

    /* SIGMA: push left away */
    body.choice-sigma .panelLeft{ transform:translateX(-100%); }
    body.choice-sigma .panelRight{ transform:translateX(0); }

    body.choice-rho .hint,
    body.choice-sigma .hint{
      opacity:0 !important;
      transform:translateY(8px) !important;
    }

    body.choice-rho .wordBtn[data-side="sigma"],
    body.choice-sigma .wordBtn[data-side="rho"]{
      opacity:.35;
      transform:scale(.98);
    }

    /* Mobile: stacked panels => titles sit on their panel */
    @media (max-width:860px){
      .hero{
        grid-template-columns:1fr;
        grid-template-rows:1fr 1fr;
      }

      .halfTitle{
        width:100%;
        top:auto;
        transform:none;
        padding:0 var(--pad);
      }
      .halfTitle.left{
        left:0;
        top:25%;
      }
      .halfTitle.right{
        right:0;
        top:75%;
      }

      .amp{
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
      }

      body.choice-rho .panelRight{ transform:translateY(100%); }
      body.choice-sigma .panelLeft{ transform:translateY(-100%); }
    }

    @media (prefers-reduced-motion: reduce){
      .panelLeft,.panelRight,.hint,.wordBtn{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="heroWrap">
    <div class="hero">
      <div class="panel panelLeft" id="panelLeft" data-choice="rho" aria-label="Ga naar Rho">
        <video autoplay muted loop playsinline preload="auto">
          <source src="assets/video/rho.mp4" type="video/mp4" />
        </video>
        <div class="hint">
          <span>Rho</span>
          <span>Klik om binnen te gaan</span>
        </div>
      </div>

      <div class="panel panelRight" id="panelRight" data-choice="sigma" aria-label="Ga naar Sigma">
        <video autoplay muted loop playsinline preload="auto">
          <source src="assets/video/sigma.mp4" type="video/mp4" />
        </video>
        <div class="hint">
          <span>Klik om binnen te gaan</span>
          <span>Sigma</span>
        </div>
      </div>
    </div>

    <!-- Left half title -->
    <div class="halfTitle left" aria-label="Rho">
      <button class="wordBtn" data-side="rho" id="btnRho" type="button">Rho</button>
      <div class="tagline">Heldere websites die jouw aanbod scherp en simpel maken.</div>
    </div>

    <!-- Right half title -->
    <div class="halfTitle right" aria-label="Sigma">
      <button class="wordBtn" data-side="sigma" id="btnSigma" type="button">Sigma</button>
      <div class="tagline">Systemisch denken, onderzoek en experiment voor wat hierna komt.</div>
    </div>

    <!-- Ampersand on the seam -->
    <span class="amp" aria-hidden="true">&</span>
  </div>

  <script>
    (function(){
      const body = document.body;
      const btnRho = document.getElementById("btnRho");
      const btnSigma = document.getElementById("btnSigma");
      const panelLeft = document.getElementById("panelLeft");
      const panelRight = document.getElementById("panelRight");

      let isLocked = false;

      function choose(side){
        if (isLocked) return;
        isLocked = true;

        body.classList.add(side === "rho" ? "choice-rho" : "choice-sigma");

        const dur = getComputedStyle(document.documentElement).getPropertyValue("--dur").trim();
        const ms = dur.endsWith("ms") ? parseFloat(dur) : (dur.endsWith("s") ? parseFloat(dur)*1000 : 700);

        window.setTimeout(() => {
          window.location.href = (side === "rho") ? "index.html" : "sigma.html";
        }, ms);
      }

      btnRho.addEventListener("click", () => choose("rho"));
      btnSigma.addEventListener("click", () => choose("sigma"));
      panelLeft.addEventListener("click", () => choose("rho"));
      panelRight.addEventListener("click", () => choose("sigma"));
    })();
  </script>
</body>
</html>
