<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  /* =========================================================
     SCROLLSTACK (smooth + hysteresis + edge snapping)
     Probleem dat we oplossen:
     - 1→2 duurt te lang  => startBias lager (progress begint eerder)
     - terugscrollen: item 1 opent nooit meer => snap-zone bovenaan
     - jitter vermijden => smoothing + hysteresis blijven behouden
  ========================================================== */
  (function(){
    const section = document.getElementById("stack");
    const list = document.getElementById("scrollstack");
    if(!section || !list) return;

    const items = Array.from(list.querySelectorAll(".stack-item"));
    const n = items.length;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function setActive(activeIndex){
      items.forEach((el, i) => {
        el.classList.toggle("is-active", i === activeIndex);
        el.classList.toggle("is-past", i < activeIndex);
      });
    }

    // ---- State ----
    let currentIndex = 0;  // “locked” actieve stap
    let smoothedP = 0;     // gesmoothde progress (0..1)
    setActive(currentIndex);

    /* ---------------------------------------------------------
       TUNING KNOBS
       - startBias lager  => sneller van 1 naar 2
       - hysteresis hoger => minder gevoelig, maar later switchen
       - smoothing lager  => zwaarder/luxer maar meer delay
       - snapTop/snapBottom => forceer eerste/laatste bij randen
    ---------------------------------------------------------- */
    const startBias = 0.18;     // was ~0.28; lager = eerder starten
    const endBias   = 0.62;     // mag blijven

    const hysteresis = 0.60;    // 0.50..0.75
    const smoothing  = 0.10;    // 0.06..0.14

    const snapTop    = 0.03;    // als rawP < 3% => force index 0
    const snapBottom = 0.97;    // als rawP > 97% => force last

    /* ---------------------------------------------------------
       rawProgress():
       - berekent waar je zit in de sectie (0..1)
       - startBias & endBias bepalen het “venster” in je viewport
    ---------------------------------------------------------- */
    function rawProgress(){
      const rect = section.getBoundingClientRect();

      const startLine = window.innerHeight * startBias;
      const endLine   = window.innerHeight * (1 - endBias);

      const total = rect.height - (startLine + endLine);
      const progressed = (startLine - rect.top);

      return total > 0 ? clamp(progressed / total, 0, 1) : 0;
    }

    /* ---------------------------------------------------------
       update():
       1) compute raw progress
       2) edge snapping (super belangrijk voor terugscroll)
       3) smooth progress (lerp)
       4) map naar pos (0..n-1) en bepaal target index
       5) hysteresis check om pas te switchen als je “echt” voorbij bent
    ---------------------------------------------------------- */
    function update(){
      const rp = rawProgress();

      // 2) EDGE SNAPPING
      // -> Als je bijna aan het begin/einde bent, forceer state.
      // -> Dit voorkomt “ik kom nooit meer terug op stap 1”.
      if (rp <= snapTop) {
        smoothedP = 0;          // reset smoothing zodat het meteen klopt
        currentIndex = 0;
        setActive(0);
        return;
      }
      if (rp >= snapBottom) {
        smoothedP = 1;
        currentIndex = n - 1;
        setActive(n - 1);
        return;
      }

      // 3) SMOOTHING (lerp)
      // smoothedP volgt rp met vertraging -> minder trackpad jitter
      smoothedP = smoothedP + (rp - smoothedP) * smoothing;

      // 4) CONTINUE POSITIE IN STAPPEN
      // n=4 => indices 0..3 => pos loopt 0..3
      const pos = smoothedP * (n - 1);

      // target is de dichtstbijzijnde stap
      const target = clamp(Math.round(pos), 0, n - 1);

      // 5) HYSTERESIS: vermijd micro-flips rond de grens
      if (target !== currentIndex) {
        const boundary = (currentIndex + target) / 2; // bv tussen 1 en 2 => 1.5
        const dist = pos - boundary;
        const goingForward = target > currentIndex;

        if (goingForward && dist > (hysteresis / 2)) {
          currentIndex = target;
          setActive(currentIndex);
        } else if (!goingForward && dist < -(hysteresis / 2)) {
          currentIndex = target;
          setActive(currentIndex);
        }
      }
    }

    /* ---------------------------------------------------------
       RAF throttle:
       - update max 1x per frame
       - voelt merkbaar smoother
    ---------------------------------------------------------- */
    let ticking = false;
    function onScroll(){
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        update();
        ticking = false;
      });
    }

    window.addEventListener("scroll", onScroll, { passive:true });
    window.addEventListener("resize", onScroll);

    // init
    update();
  })();
</script>
