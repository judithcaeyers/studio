<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rho / Sigma</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Roboto:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --ease:cubic-bezier(.2,.9,.2,1);
      --dur:700ms;

      --title-size:clamp(44px,6vw,96px);
      --tagline-size:clamp(16px,1.6vw,22px); /* groter dan nu */
      --pad:clamp(18px,3vw,36px);
      --tagline-max:44ch;

      --intro-dur:850ms;
      --intro-delay-title:120ms;
      --intro-delay-tag:240ms;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:"EB Garamond", serif;
      overflow:hidden;
    }

    /* ===== HERO ===== */
    .heroWrap{
      height:100svh;
      width:100%;
      position:relative;
      overflow:hidden;
    }

    .hero{
      height:100%;
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .panel{
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }

    .panel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.03);
      filter:contrast(1.05) brightness(.9);
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,.1),
        rgba(0,0,0,.55)
      );
      pointer-events:none;
    }

    /* ===== TITLES ===== */
    .halfTitle{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:50%;
      z-index:5;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:14px;
      padding:0 var(--pad);
      pointer-events:none;
    }
    .halfTitle.left{ left:0; }
    .halfTitle.right{ right:0; }

    /* intro animation: slide up + fade in */
    .introIn{
      opacity:0;
      transform:translateY(26px);
      will-change:opacity, transform;
    }
    body.is-ready .introIn{
      opacity:1;
      transform:translateY(0);
      transition:
        opacity var(--intro-dur) var(--ease),
        transform var(--intro-dur) var(--ease);
    }

    /* stagger */
    body.is-ready .halfTitle .wordBtn.introIn{
      transition-delay: var(--intro-delay-title);
    }
    body.is-ready .halfTitle .tagline.introIn{
      transition-delay: var(--intro-delay-tag);
    }

    .wordBtn{
      pointer-events:auto;
      background:none;
      border:none;
      color:var(--fg);
      font-family:"Roboto", sans-serif;
      font-weight:700;
      text-transform:uppercase;
      font-size:var(--title-size);
      line-height:1;
      cursor:pointer;
      text-shadow:0 10px 30px rgba(0,0,0,.35);
      transition:opacity 240ms var(--ease), transform 240ms var(--ease);
    }

    /* Tagline: sans serif + groter */
    .tagline{
      max-width:var(--tagline-max);
      font-family:"Roboto", sans-serif; /* zonder schreef */
      font-size:var(--tagline-size);
      line-height:1.35;
      opacity:0;              /* desktop default: hidden */
      transform:translateY(6px);
      transition:
        opacity 300ms var(--ease),
        transform 300ms var(--ease);
      pointer-events:none;
    }

    /* ===== HOVER LOGIC (desktop) ===== */
    .panelLeft:hover ~ .halfTitle.left .tagline,
    .halfTitle.left:hover .tagline{
      opacity:.88;
      transform:translateY(0);
    }

    .panelRight:hover ~ .halfTitle.right .tagline,
    .halfTitle.right:hover .tagline{
      opacity:.88;
      transform:translateY(0);
    }

    /* When chosen, keep the chosen tagline visible */
    body.choice-rho .halfTitle.left .tagline,
    body.choice-sigma .halfTitle.right .tagline{
      opacity:.88;
      transform:translateY(0);
    }

    /* ===== EXPAND ANIMATION ===== */
    .panelLeft,.panelRight{
      transition:transform var(--dur) var(--ease);
      will-change:transform;
    }

    body.choice-rho .panelRight{ transform:translateX(100%); }
    body.choice-sigma .panelLeft{ transform:translateX(-100%); }

    body.choice-rho .wordBtn[data-side="sigma"],
    body.choice-sigma .wordBtn[data-side="rho"]{
      opacity:.35;
      transform:scale(.98);
    }

    /* ===== MOBILE ===== */
    @media (max-width:860px){
      .hero{
        grid-template-columns:1fr;
        grid-template-rows:1fr 1fr;
      }

      .halfTitle{
        width:100%;
        top:auto;
        transform:none;
      }
      .halfTitle.left{ top:25%; }
      .halfTitle.right{ top:75%; }

      /* On mobile: tagline always visible (no hover) */
      .tagline{
        opacity:.9;
        transform:translateY(0);
      }

      body.choice-rho .panelRight{ transform:translateY(100%); }
      body.choice-sigma .panelLeft{ transform:translateY(-100%); }
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
      .introIn{ opacity:1 !important; transform:none !important; }
    }
  </style>
</head>

<body>
  <div class="heroWrap">
    <div class="hero">
      <div class="panel panelLeft panelLeft" id="panelLeft">
        <video autoplay muted loop playsinline>
          <source src="assets/video/rho.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="panel panelRight panelRight" id="panelRight">
        <video autoplay muted loop playsinline>
          <source src="assets/video/sigma.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="halfTitle left">
      <button class="wordBtn introIn" data-side="rho" id="btnRho">Rho</button>
      <div class="tagline introIn">
        Heldere websites die jouw werk structureren en scherp maken.
      </div>
    </div>

    <div class="halfTitle right">
      <button class="wordBtn introIn" data-side="sigma" id="btnSigma">Sigma</button>
      <div class="tagline introIn">
        Systemisch denken, onderzoek en experiment voor wat hierna komt.
      </div>
    </div>
  </div>

  <script>
    (function(){
      const body = document.body;
      const btnRho = document.getElementById("btnRho");
      const btnSigma = document.getElementById("btnSigma");
      const panelLeft = document.getElementById("panelLeft");
      const panelRight = document.getElementById("panelRight");

      // trigger intro animation on load (next frame so transitions apply)
      requestAnimationFrame(() => {
        body.classList.add("is-ready");
      });

      let locked = false;

      function choose(side){
        if (locked) return;
        locked = true;

        body.classList.add(side === "rho" ? "choice-rho" : "choice-sigma");

        const dur = getComputedStyle(document.documentElement)
          .getPropertyValue("--dur").trim();
        const ms = dur.endsWith("ms")
          ? parseFloat(dur)
          : parseFloat(dur) * 1000;

        setTimeout(() => {
          location.href = side === "rho" ? "rho.html" : "sigma.html";
        }, ms);
      }

      btnRho.onclick = () => choose("rho");
      btnSigma.onclick = () => choose("sigma");
      panelLeft.onclick = () => choose("rho");
      panelRight.onclick = () => choose("sigma");
    })();
  </script>
</body>
</html>
