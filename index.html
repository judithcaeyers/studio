<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rho / Sigma</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Roboto:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --ease:cubic-bezier(.2,.9,.2,1);
      --dur:700ms;

      --pad:clamp(18px,3vw,36px);
      --label:12px;
      --tag:clamp(26px,2.9vw,44px);
      --tag-mobile:clamp(26px,6.2vw,44px);

      --line: rgba(255,255,255,.24);
      --glass: rgba(0,0,0,.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      overflow:hidden;
      font-family:"EB Garamond", serif;
    }

    /* ===== STAGE ===== */
    .stage{
      position:relative;
      height:100svh;
      width:100%;
      overflow:hidden;
      background:#000;
      cursor:default;
    }

    .media{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns: 1fr 1fr;
      will-change: transform;
    }

    .pane{
      position:relative;
      overflow:hidden;
      cursor:pointer;
      will-change: flex, transform;
    }

    .pane video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.05);
      filter:contrast(1.05) brightness(.9);
      -webkit-transform:translateZ(0) scale(1.05);
    }

    /* soft vignette */
    .pane::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.62));
      pointer-events:none;
    }

    /* ===== CENTER LINE (moves with cursor) ===== */
    .seam{
      position:absolute;
      top:0;
      bottom:0;
      left:50%;
      width:1px;
      background:var(--line);
      z-index:6;
      transform: translateX(-0.5px);
      transition: opacity 300ms var(--ease);
      pointer-events:none;
    }

    /* ===== OVERLAY COPY ===== */
    .overlay{
      position:absolute;
      inset:0;
      z-index:7;
      pointer-events:none;
    }

    .block{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      width:min(44vw, 560px);
      padding: 0 var(--pad);
      display:flex;
      flex-direction:column;
      gap:12px;
      opacity:0;
      transform-origin:center;
      will-change: opacity, transform;
    }

    /* Always show labels; tagline fades in on hover/focus */
    .label{
      font-family:"Roboto", sans-serif;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:var(--label);
      opacity:.78;
    }

    .tagline{
      font-size:var(--tag);
      line-height:1.08;
      letter-spacing:-0.01em;
      margin:0;
    }

    .enter{
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-family:"Roboto", sans-serif;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:12px;
      opacity:.0;
      transform: translateY(6px);
      transition: opacity 320ms var(--ease), transform 320ms var(--ease);
      width:max-content;
      padding: 10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.28);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(6px);
      color:#fff;
    }

    .enter .arrow{ font-size:16px; opacity:.95; }

    /* Position blocks */
    .block.rho{ left:0; text-align:left; }
    .block.sigma{ right:0; text-align:right; align-items:flex-end; }

    /* Intro animation: gentle rise */
    body.is-ready .block{
      opacity:1;
      transform: translateY(calc(-50% + 0px));
      transition: opacity 900ms var(--ease), transform 900ms var(--ease);
    }
    body.is-ready .block.rho{ transition-delay: 90ms; }
    body.is-ready .block.sigma{ transition-delay: 180ms; }

    /* ===== FLUID HOVER EXPAND (desktop) =====
       We do this by changing grid columns via CSS variables set in JS.
    */
    .media{
      grid-template-columns: var(--left, 1fr) var(--right, 1fr);
      transition: grid-template-columns 420ms var(--ease);
    }

    /* Tagline visibility: subtle until hover */
    .block .tagline{ opacity:.85; transition: opacity 260ms var(--ease); }
    .block .enter{ pointer-events:none; } /* desktop uses click anywhere; buttons are visual */

    .stage.is-hover-left .media{ --left: 1.22fr; --right: 0.78fr; }
    .stage.is-hover-right .media{ --left: 0.78fr; --right: 1.22fr; }

    .stage.is-hover-left .block.rho .tagline,
    .stage.is-hover-right .block.sigma .tagline{
      opacity:1;
    }

    .stage.is-hover-left .block.rho .enter,
    .stage.is-hover-right .block.sigma .enter{
      opacity:.92;
      transform: translateY(0);
    }

    .stage.is-hover-left .block.sigma .tagline,
    .stage.is-hover-right .block.rho .tagline{
      opacity:.55;
    }

    /* ===== CLICK EXPAND (same as before) ===== */
    .pane{
      transition: transform var(--dur) var(--ease);
    }
    body.choice-rho .pane.sigma{ transform: translateX(100%); }
    body.choice-sigma .pane.rho{ transform: translateX(-100%); }
    body.choice-rho .seam,
    body.choice-sigma .seam{ opacity:0; }

    /* ===== MOBILE ===== */
    @media (max-width:860px){
      body{ overflow:auto; }
      .stage{ height:auto; overflow:visible; }

      .media{
        position:relative;
        grid-template-columns:1fr;
        grid-auto-rows: 100svh;
        transition:none;
      }

      .seam{ display:none; }

      .pane{ cursor:pointer; }
      .pane.rho{ order:0; }
      .pane.sigma{ order:1; }

      .overlay{
        position:relative;
        inset:auto;
        pointer-events:none;
      }

      .block{
        position:absolute;
        width:calc(100% - (var(--pad)*2));
        padding:0;
        top:auto;
        transform:none;
        opacity:1;
      }

      /* Place copy within each panel */
      .block.rho{
        left:var(--pad);
        right:var(--pad);
        top: 14%;
        text-align:left;
        align-items:flex-start;
      }
      .block.sigma{
        left:var(--pad);
        right:var(--pad);
        top: calc(100svh + 14%);
        text-align:right;
        align-items:flex-end;
      }

      .tagline{
        font-size: var(--tag-mobile);
        line-height:1.08;
        opacity:1 !important;
      }

      /* On mobile we want real tap targets */
      .enter{
        opacity:.92 !important;
        transform:none !important;
        pointer-events:auto;
        -webkit-appearance:none;
        appearance:none;
      }

      /* Arrows: left for rho, right for sigma */
      .block.rho .enter .arrow{ content:"←"; }
      .block.sigma .enter .arrow{ content:"→"; }

      /* Mobile push is vertical */
      body.choice-rho .pane.sigma{ transform: translateY(100%); }
      body.choice-sigma .pane.rho{ transform: translateY(-100%); }
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="media" id="media">
      <div class="pane rho" id="paneRho" data-side="rho" aria-label="Ga naar Rho">
        <video id="videoRho" autoplay muted loop playsinline preload="auto">
          <source src="assets/video/rho.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="pane sigma" id="paneSigma" data-side="sigma" aria-label="Ga naar Sigma">
        <video id="videoSigma" autoplay muted loop playsinline preload="auto">
          <source src="assets/video/sigma.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="seam" id="seam"></div>

    <div class="overlay">
      <!-- RHO -->
      <div class="block rho" id="blockRho">
        <div class="label">Rho</div>
        <p class="tagline">
          <span style="display:block; margin-bottom:10px;">
            We make what you do unmistakably clear.
          </span>
          <span style="display:block; opacity:.78;">
            No endless pages. Just a website that says exactly what you do.
          </span>
        </p>

        <div class="enter" aria-hidden="true">
          <span class="arrow">←</span><span>Enter</span>
        </div>
      </div>

      <!-- SIGMA -->
      <div class="block sigma" id="blockSigma">
        <div class="label">Sigma</div>
        <p class="tagline">
          Our laboratory for ideas that aren’t fully defined — yet.
        </p>

        <div class="enter" aria-hidden="true">
          <span>Enter</span><span class="arrow">→</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const body = document.body;
      const stage = document.getElementById("stage");
      const seam  = document.getElementById("seam");
      const paneRho = document.getElementById("paneRho");
      const paneSigma = document.getElementById("paneSigma");
      const videoRho = document.getElementById("videoRho");
      const videoSigma = document.getElementById("videoSigma");

      requestAnimationFrame(() => body.classList.add("is-ready"));

      // Move seam with pointer (desktop)
      function setSeam(x){
        const rect = stage.getBoundingClientRect();
        const p = Math.min(0.68, Math.max(0.32, (x - rect.left) / rect.width));
        seam.style.left = (p * 100) + "%";
      }

      stage.addEventListener("mousemove", (e) => {
        if (window.matchMedia("(max-width:860px)").matches) return;

        setSeam(e.clientX);

        const rect = stage.getBoundingClientRect();
        const mid = rect.left + rect.width / 2;
        stage.classList.toggle("is-hover-left", e.clientX < mid);
        stage.classList.toggle("is-hover-right", e.clientX >= mid);
      });

      stage.addEventListener("mouseleave", () => {
        stage.classList.remove("is-hover-left", "is-hover-right");
        seam.style.left = "50%";
      });

      // Mobile: force play on load (best effort; iOS still may block sometimes)
      function forcePlay(video){
        if (!video) return;
        try{
          video.muted = true;
          video.playsInline = true;
          const p = video.play();
          if (p && typeof p.catch === "function") p.catch(()=>{});
        }catch(e){}
      }

      window.addEventListener("load", () => {
        if (window.matchMedia("(max-width:860px)").matches){
          forcePlay(videoRho);
          forcePlay(videoSigma);
        }
      });

      let locked = false;
      function choose(side){
        if (locked) return;
        locked = true;

        body.classList.add(side === "rho" ? "choice-rho" : "choice-sigma");

        const dur = getComputedStyle(document.documentElement).getPropertyValue("--dur").trim();
        const ms = dur.endsWith("ms") ? parseFloat(dur) : (parseFloat(dur) * 1000 || 700);

        setTimeout(() => {
          location.href = side === "rho" ? "rho.html" : "sigma.html";
        }, ms);
      }

      paneRho.addEventListener("click", () => choose("rho"));
      paneSigma.addEventListener("click", () => choose("sigma"));

      // Bonus: tap on the "Enter" pill on mobile
      stage.addEventListener("click", (e) => {
        if (!window.matchMedia("(max-width:860px)").matches) return;

        const t = e.target;
        if (!t) return;
        const enter = t.closest && t.closest(".enter");
        if (!enter) return;

        // Determine which block the enter belongs to
        const isRho = !!enter.closest(".block.rho");
        choose(isRho ? "rho" : "sigma");
      });
    })();
  </script>
</body>
</html>
