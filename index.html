<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rho / Sigma</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --ease:cubic-bezier(.2,.9,.2,1);
      --dur:700ms;

      --title-size:clamp(44px,6vw,96px);

      --tagline-size:clamp(16px,1.6vw,22px);
      --tagline-max:32ch;

      --pad:clamp(18px,3vw,36px);

      --intro-dur:1400ms;
      --intro-delay-title:160ms;
      --intro-delay-tag:420ms;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:"EB Garamond", serif;
      overflow:hidden;
    }

    /* ===== HERO ===== */
    .heroWrap{
      height:100svh;
      width:100%;
      position:relative;
      overflow:hidden;
    }

    .hero{
      height:100%;
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .panel{
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }

    .panel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.03);
      filter:contrast(1.05) brightness(.9);
      -webkit-transform:translateZ(0) scale(1.03);
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.10), rgba(0,0,0,.55));
      pointer-events:none;
    }

    /* ===== TITLES ===== */
    .halfTitle{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:50%;
      z-index:5;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:14px;
      padding:0 var(--pad);
      pointer-events:none;
    }

    /* Rho iets hoger */
    .halfTitle.left{
      left:0;
      top:38%;
    }
    .halfTitle.right{
      right:0;
    }

    /* intro animation */
    .introIn{
      opacity:0;
      transform:translateY(26px);
      will-change:opacity, transform;
    }
    body.is-ready .introIn{
      opacity:1;
      transform:translateY(0);
      transition:
        opacity var(--intro-dur) var(--ease),
        transform var(--intro-dur) var(--ease);
    }
    body.is-ready .halfTitle .wordBtn.introIn{ transition-delay: var(--intro-delay-title); }
    body.is-ready .halfTitle .tagline.introIn{ transition-delay: var(--intro-delay-tag); }
    body.is-ready .halfTitle .enterBtn.introIn{ transition-delay: calc(var(--intro-delay-tag) + 160ms); }

    .wordBtn{
      pointer-events:auto;
      background:none;
      border:none;
      color:var(--fg);
      font-family:"Roboto", sans-serif;
      font-weight:700;
      text-transform:uppercase;
      font-size:var(--title-size);
      line-height:1;
      cursor:pointer;
      text-shadow:0 10px 30px rgba(0,0,0,.35);
      transition:opacity 240ms var(--ease), transform 240ms var(--ease);
    }

    /* Taglines */
    .tagline{
      max-width:var(--tagline-max);
      font-size:var(--tagline-size);
      line-height:1.35;
      opacity:0;
      transform:translateY(6px);
      transition:opacity 300ms var(--ease), transform 300ms var(--ease);
      pointer-events:none;

      /* terug met schreef voor Rho én Sigma */
      font-family:"EB Garamond", serif;
      font-weight:400;
    }

    .tagline .line1{ display:block; margin-bottom:8px; }
    .tagline .line2{ display:block; opacity:.78; }

    /* Hover desktop */
    .panelLeft:hover ~ .halfTitle.left .tagline,
    .halfTitle.left:hover .tagline{
      opacity:.88;
      transform:translateY(0);
    }
    .panelRight:hover ~ .halfTitle.right .tagline,
    .halfTitle.right:hover .tagline{
      opacity:.88;
      transform:translateY(0);
    }

    /* Expand */
    .panelLeft,.panelRight{
      transition:transform var(--dur) var(--ease);
      will-change:transform;
    }
    body.choice-rho .panelRight{ transform:translateX(100%); }
    body.choice-sigma .panelLeft{ transform:translateX(-100%); }

    body.choice-rho .wordBtn[data-side="sigma"],
    body.choice-sigma .wordBtn[data-side="rho"]{
      opacity:.35;
      transform:scale(.98);
    }

    body.choice-rho .halfTitle.left .tagline,
    body.choice-sigma .halfTitle.right .tagline{
      opacity:.88;
      transform:translateY(0);
    }

    /* ===== MOBILE ===== */
    @media (max-width:860px){
      .hero{
        grid-template-columns:1fr;
        grid-template-rows:1fr 1fr;
      }

      /* we tonen op mobile niet de grote Rho/Sigma knoppen */
      .wordBtn{ display:none; }

      .halfTitle{
        width:100%;
        transform:none;
        align-items:stretch;
        gap:12px;
      }

      .halfTitle.left{ top:12%; text-align:left; }
      .halfTitle.right{ top:66%; text-align:right; }

      /* Tagline groot + altijd zichtbaar */
      .tagline{
        opacity:1;
        transform:none;
        max-width:none;
        font-size:clamp(28px,6vw,44px);
        line-height:1.1;
      }

      /* klein label Rho/Sigma */
      .miniLabel{
        display:block;
        font-family:"Roboto", sans-serif;
        font-size:12px;
        letter-spacing:.12em;
        text-transform:uppercase;
        opacity:.7;
      }
      .halfTitle.right .miniLabel{ text-align:right; }

      /* Enter buttons (wit, geen iOS blauw) */
      .enterBtn{
        pointer-events:auto;
        display:inline-flex;
        align-items:center;
        gap:10px;

        font-family:"Roboto", sans-serif;
        font-weight:500;
        font-size:14px;
        letter-spacing:.10em;
        text-transform:uppercase;

        color:#fff;
        background:rgba(0,0,0,.18);
        border:1px solid rgba(255,255,255,.35);
        padding:10px 14px;
        border-radius:999px;
        cursor:pointer;
        backdrop-filter:blur(6px);

        -webkit-appearance:none;
        appearance:none;
        outline:none;

        /* intro anim start */
        opacity:0;
        transform:translateY(10px);
      }
      body.is-ready .enterBtn{
        opacity:.92;
        transform:translateY(0);
        transition:
          opacity var(--intro-dur) var(--ease),
          transform var(--intro-dur) var(--ease);
      }

      .enterBtn:visited,
      .enterBtn:focus,
      .enterBtn:active{
        color:#fff;
        outline:none;
        box-shadow:none;
      }

      .enterBtn .arrow{
        font-size:16px;
        line-height:1;
        opacity:.95;
      }

      .halfTitle.left .enterBtn{ justify-self:start; width:max-content; }
      .halfTitle.right .enterBtn{ justify-self:end; width:max-content; margin-left:auto; }

      /* Mobile push vertical */
      body.choice-rho .panelRight{ transform:translateY(100%); }
      body.choice-sigma .panelLeft{ transform:translateY(-100%); }
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
      .introIn{ opacity:1 !important; transform:none !important; }
    }
  </style>
</head>

<body>
  <div class="heroWrap">
    <div class="hero">
      <div class="panel panelLeft" id="panelLeft">
        <video id="videoRho" autoplay muted loop playsinline preload="auto">
          <source src="assets/video/rho.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="panel panelRight" id="panelRight">
        <video id="videoSigma" autoplay muted loop playsinline preload="auto">
          <source src="assets/video/sigma.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <div class="halfTitle left">
      <button class="wordBtn introIn" data-side="rho" id="btnRho">Rho</button>
      <span class="miniLabel introIn">Rho</span>

      <div class="tagline introIn">
        <span class="line1">We make what you do unmistakably clear.</span>
        <span class="line2">No endless pages. Just a website that says exactly what you do.</span>
      </div>

      <!-- Mobile enter -->
      <button class="enterBtn introIn" type="button" id="enterRho">
        <span class="arrow">←</span><span>Enter</span>
      </button>
    </div>

    <div class="halfTitle right">
      <button class="wordBtn introIn" data-side="sigma" id="btnSigma">Sigma</button>
      <span class="miniLabel introIn">Sigma</span>

      <div class="tagline introIn">
        Our laboratory for ideas that aren’t fully defined — yet.
      </div>

      <!-- Mobile enter -->
      <button class="enterBtn introIn" type="button" id="enterSigma">
        <span>Enter</span><span class="arrow">→</span>
      </button>
    </div>
  </div>

  <script>
    (function(){
      const body = document.body;

      const btnRho = document.getElementById("btnRho");
      const btnSigma = document.getElementById("btnSigma");
      const panelLeft = document.getElementById("panelLeft");
      const panelRight = document.getElementById("panelRight");

      const enterRho = document.getElementById("enterRho");
      const enterSigma = document.getElementById("enterSigma");

      const videoRho = document.getElementById("videoRho");
      const videoSigma = document.getElementById("videoSigma");

      requestAnimationFrame(() => body.classList.add("is-ready"));

      // MOBILE: probeer videos meteen te starten bij load
      function forcePlay(video){
        if(!video) return;
        try{
          video.muted = true;
          video.playsInline = true;
          const p = video.play();
          if(p && typeof p.catch === "function") p.catch(()=>{});
        }catch(e){}
      }

      window.addEventListener("load", () => {
        if(window.matchMedia("(max-width:860px)").matches){
          forcePlay(videoRho);
          forcePlay(videoSigma);
        }
      });

      let locked=false;
      function choose(side){
        if(locked) return;
        locked=true;

        body.classList.add(side==="rho" ? "choice-rho" : "choice-sigma");

        const dur = getComputedStyle(document.documentElement)
          .getPropertyValue("--dur").trim();
        const ms = dur.endsWith("ms") ? parseFloat(dur) : parseFloat(dur) * 1000;

        setTimeout(()=>{
          location.href = side==="rho" ? "rho.html" : "sigma.html";
        }, ms);
      }

      // desktop buttons (hidden on mobile)
      if(btnRho) btnRho.onclick = () => choose("rho");
      if(btnSigma) btnSigma.onclick = () => choose("sigma");

      // panels
      panelLeft.onclick = () => choose("rho");
      panelRight.onclick = () => choose("sigma");

      // mobile enter buttons
      if(enterRho) enterRho.onclick = () => choose("rho");
      if(enterSigma) enterSigma.onclick = () => choose("sigma");
    })();
  </script>
</body>
</html>
